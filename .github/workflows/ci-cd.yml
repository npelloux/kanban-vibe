name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "npm"

      - name: Install dependencies
        uses: bahmutov/npm-install@v1

      - name: Run linting
        run: npm run lint || echo "No linting configured"

      - name: Run tests
        run: npm test --

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: ./dist

  # Image servie sur le serveur aelworks (kanban.aelworks.fr). Construite sur
  # chaque PR pour la vérifier, publiée seulement depuis main.
  image:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/npelloux/kanban-vibe:latest
            ghcr.io/npelloux/kanban-vibe:${{ github.sha }}

  deploy-vercel:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Vercel pull
        run: npx vercel@39 pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel build
        run: npx vercel@39 build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel deploy
        run: npx vercel@39 deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
